<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Verify credentials against issuer records. Explore VERIDOC’s credential verification and institutional trust workflows."
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("veridoc-theme");
        if (savedTheme === "dark" || savedTheme === "light")
          document.documentElement.dataset.theme = savedTheme;
      } catch {
        /* Fall back to the system color scheme. */
      }
    </script>
    <title>VERIDOC – Verify a credential</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
